<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PSS by J. Garavagno®</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M50 5 L10 25 V50 C10 75 50 95 50 95 C50 95 90 75 90 50 V25 L50 5Z%22 fill=%22%230f172a%22/><path d=%22M35 50 L45 60 L65 40%22 stroke=%22%2310b981%22 stroke-width=%228%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22/></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Firebase SDK (v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body data-theme="light">
    <!-- Loading Overlay -->
    <div id="loading-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
        <div
            style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;">
        </div>
        <p style="margin-top: 1rem; font-weight: 500;">Sincronizando con la Nube...</p>
    </div>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text" style="font-size: 1.1rem; line-height: 1.2;">SISTEMA PSS<br><small
                        style="font-size: 0.75rem; font-weight: 400; opacity: 0.8;">by Jorge Garavagno®</small></span>
            </div>
            <nav>
                <button class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </button>
                <button class="nav-item" data-view="providers">
                    <i data-lucide="users"></i> Proveedores
                </button>
                <button class="nav-item" data-view="vehicles">
                    <i data-lucide="truck"></i> Flota
                </button>
            </nav>
            <div class="user-role-selector">
                <label for="role-select">Rol:</label>
                <select id="role-select">
                    <option value="consulta">Consulta</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <h1 id="view-title">Dashboard</h1>
                <div class="user-info">
                    <span id="current-user-role">Consulta</span>
                </div>
            </header>
            <div id="view-container">
                <!-- Views will be injected here -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>

</html>
